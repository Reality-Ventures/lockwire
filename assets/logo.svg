<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- lockwire mark: two fasteners, wired together so neither can work loose —
       the literal aviation technique the name comes from, not a metaphor. -->
  <rect width="256" height="256" rx="48" fill="#0d1117"/>

  <!-- twisted safety wire, drawn first so the bolt heads sit on top of it -->
  <g fill="none" stroke="#f5a623" stroke-linecap="round">
    <path d="M110,97 C121,102 118,113 128,117 C138,121 133,132 144,138 C153,144 149,154 146,159"
          stroke-width="5"/>
    <g stroke-width="4">
      <line x1="117.4" y1="111.9" x2="127.8" y2="106.1"/>
      <line x1="127.4" y1="131.9" x2="137.8" y2="126.1"/>
      <line x1="137.4" y1="150.9" x2="147.8" y2="145.1"/>
    </g>
  </g>

  <!-- bolt A -->
  <g>
    <polygon points="86,52 115.4,69 115.4,103 86,120 56.6,103 56.6,69"
             fill="#cbd5e1" stroke="#0d1117" stroke-width="3"/>
    <polygon points="86,64 103.9,74.5 103.9,95.5 86,106 68.1,95.5 68.1,74.5"
             fill="none" stroke="#0d1117" stroke-width="2" opacity="0.35"/>
    <circle cx="110" cy="97" r="5.5" fill="#0d1117"/>
  </g>

  <!-- bolt B -->
  <g>
    <polygon points="170,136 199.4,153 199.4,187 170,204 140.6,187 140.6,153"
              fill="#cbd5e1" stroke="#0d1117" stroke-width="3"/>
    <polygon points="170,148 187.9,158.5 187.9,179.5 170,190 152.1,179.5 152.1,158.5"
              fill="none" stroke="#0d1117" stroke-width="2" opacity="0.35"/>
    <circle cx="146" cy="159" r="5.5" fill="#0d1117"/>
  </g>
</svg>
