name: "lockwire check"
description: "Fail the build when documentation claims have drifted from the code they're bound to."
branding:
  icon: "anchor"
  color: "blue"
inputs:
  args:
    description: "Extra arguments passed to `lockwire check`, e.g. `--changed`."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - shell: bash
      run: npx --yes lockwire@0.1 check --format github ${{ inputs.args }}
