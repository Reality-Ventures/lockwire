name: Release

# Every push to main publishes to npm. The version is computed in CI (scripts/next-version.mjs) and
# never committed back. Put [skip ci] in a commit message to push without publishing.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest # trusted publishing needs npm >=11.5.1
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run build
      - run: npm test
      - run: npm version "$(node scripts/next-version.mjs)" --no-git-tag-version --allow-same-version
      - run: npm publish
      # npm makes a new version visible asynchronously ("may take a few minutes"). Hold the job open
      # until it is, so the next queued run (concurrency group above) can't compute the same version.
      - name: Wait for the version to appear on npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for _ in $(seq 90); do
            curl -sf "https://registry.npmjs.org/$name/$version?t=$(date +%s)" >/dev/null && exit 0
            sleep 10
          done
          echo "$name@$version still not visible on npm after 15 minutes" >&2
          exit 1
