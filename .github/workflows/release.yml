name: Release

# Every push to main publishes to npm, but only after the full CI suite (ci.yml, Ubuntu and Windows)
# passes on that commit: a red CI run never reaches npm. The version is computed here
# (scripts/next-version.mjs) and never committed back. Put [skip ci] in a commit message to push
# without publishing.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@12.2.1 # trusted publishing needs npm >=11.5.1; pinned, as it runs with the publish token
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run build
      - run: npm test
      - run: npm version "$(node scripts/next-version.mjs)" --no-git-tag-version --allow-same-version
      - run: npm publish
      # npm makes a new version visible asynchronously ("may take a few minutes"). Hold the job open
      # until it is, so the next queued run (concurrency group above) can't compute the same version.
      - name: Wait for the version to appear on npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for _ in $(seq 90); do
            curl -sf "https://registry.npmjs.org/$name/$version?t=$(date +%s)" >/dev/null && exit 0
            sleep 10
          done
          echo "$name@$version still not visible on npm after 15 minutes" >&2
          exit 1
