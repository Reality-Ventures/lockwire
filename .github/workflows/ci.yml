name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: dogfood — lockwire checks its own docs
        run: node dist/cli.js check
