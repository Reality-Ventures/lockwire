name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same jobs and publishes only if they pass.
  workflow_call:

# Tests need nothing but to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: dogfood — lockwire checks its own docs
        run: node dist/cli.js check
